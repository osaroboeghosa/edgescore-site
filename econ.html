<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Economic Heatmap</title>
<style>body{margin:0;padding:14px;background:#0a0e1f;color:#e5e7eb;font:14px system-ui,sans-serif}h1{font-size:20px;margin:0 0 4px}.s{color:#8b93a7;font-size:12px;margin-bottom:12px}a{color:#818cf8}.w{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:7px 8px;text-align:center;border:1px solid #0a0e1f;white-space:nowrap}th{color:#9aa3b8;font-size:12px;background:#11162b}td.i{text-align:left;font-weight:600;background:#11162b;position:sticky;left:0}td small{display:block;font-size:10px;opacity:.75}.g{background:#15803d}.r{background:#b91c1c}.n{background:#1e2440}.f{color:#8b93a7;font-size:11px;margin-top:12px}</style></head><body>
<h1>Economic Heatmap</h1><div class="s">US macro data, latest on the left. <a href="quant.html">Quant</a> | <a href="index.html">Classic</a></div>
<div class="w"><table id="t"><tr><td>Loading...</td></tr></table></div>
<div class="f">Colour = change vs the previous release. Green = improving for the economy (for UNEMP and CLAIMS, falling is green). Red = worsening. Data may lag official releases. Not financial advice.</div>
<script>
const URL_='https://lveqwyasscpwslqvitbt.supabase.co';
const INV=['UNEMP','CLAIMS'];
(async()=>{try{
const h=await (await fetch('quant.html')).text();
const m=h.match(/(sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)/);
if(!m)throw new Error('key not found in quant.html');
const key=m[1];const hd={apikey:key};if(key.startsWith('eyJ'))hd.Authorization='Bearer '+key;
const r=await fetch(URL_+'/rest/v1/macro?select=indicator,period,actual&order=period.desc&limit=1000',{headers:hd});
const rows=await r.json();if(!Array.isArray(rows))throw new Error(JSON.stringify(rows));
const by={};rows.forEach(x=>{(by[x.indicator]=by[x.indicator]||[]).push(x)});
const N=6;let o='<tr><th>Indicator</th><th>Latest</th><th>-1</th><th>-2</th><th>-3</th><th>-4</th><th>-5</th></tr>';
Object.keys(by).sort().forEach(k=>{const a=by[k];o+='<tr><td class="i">'+k+'</td>';
for(let i=0;i<N;i++){const c=a[i];if(!c){o+='<td class="n">-</td>';continue}
const p=a[i+1];let cls='n';if(p&&c.actual!=null&&p.actual!=null&&c.actual!==p.actual){let up=c.actual>p.actual;if(INV.includes(k))up=!up;cls=up?'g':'r'}
const v=Number(c.actual);o+='<td class="'+cls+'">'+(isNaN(v)?'-':(Math.abs(v)>=1000?v.toLocaleString(undefined,{maximumFractionDigits:0}):v.toFixed(2)))+'<small>'+c.period.slice(2,10)+'</small></td>'}
o+='</tr>'});
document.getElementById('t').innerHTML=o}catch(e){document.getElementById('t').innerHTML='<tr><td>Error: '+e.message+'</td></tr>'}})();
</script></body></html>
