<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard - EdgeScore</title><link rel="stylesheet" href="app.css">
<style>.hm{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}.hm a{display:block;border-radius:8px;padding:8px;text-align:center;color:#fff}.hm b{display:block;font-size:12px}.hm span{font-size:15px;font-weight:700}.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.rw{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--b)}</style></head><body>
<div id="hdr"></div><main>
<h1>Dashboard</h1><div class="sub" id="sub">Loading...</div>
<div class="grid" id="kp"></div>
<div class="card"><h2>Market heatmap (Quant score)</h2><div class="hm" id="hm"></div></div>
<div class="two"><div class="card"><h2>Strongest</h2><div id="tp"></div></div><div class="card"><h2>Weakest</h2><div id="bt"></div></div></div>
<div class="card"><h2>Risk gauge</h2><div id="rg"></div></div>
</main><script src="app.js"></script><script>
shell();
const hue=s=>{const v=Math.max(-40,Math.min(40,s))/40;return v>=0?'rgba(52,211,153,'+(0.2+0.6*v)+')':'rgba(248,113,113,'+(0.2+0.6*-v)+')'};
(async()=>{try{
const [q,g]=await Promise.all([api('quant_latest?select=symbol,score,as_of&order=score.desc'),api('risk_gauge?select=*&order=as_of.desc&limit=1')]);
const n=q.length,avg=q.reduce((a,x)=>a+ +x.score,0)/n;
$('sub').textContent='Updated '+q[0].as_of+' | '+n+' markets | refreshed every weekday';
const k=(v,t,c)=>'<div class="kpi"><b class="'+(c||'')+'">'+v+'</b><span>'+t+'</span></div>';
const x=g[0];
$('kp').innerHTML=(x?k((x.score>0?'+':'')+x.score+' '+x.regime,'Risk gauge',cls(x.score)):'')+k(q.filter(r=>r.score>=5).length,'Bullish markets','pos')+k(q.filter(r=>r.score<=-5).length,'Bearish markets','neg')+k(sgn(avg),'Average score',cls(avg));
$('hm').innerHTML=q.map(r=>'<a href="asset.html?symbol='+r.symbol+'" style="background:'+hue(+r.score)+'"><b>'+r.symbol+'</b><span>'+sgn(r.score,0)+'</span></a>').join('');
const row=r=>'<div class="rw"><a href="asset.html?symbol='+r.symbol+'">'+r.symbol+'</a><b class="'+cls(r.score)+'">'+sgn(r.score)+'</b></div>';
$('tp').innerHTML=q.slice(0,5).map(row).join('');$('bt').innerHTML=q.slice(-5).reverse().map(row).join('');
if(x){let o='';for(const c in x.components){const v=x.components[c];o+='<span class="chip" style="border-color:'+(v>0?'var(--g)':v<0?'var(--r)':'var(--b)')+'">'+c+' '+sgn(v,0)+'</span> '}$('rg').innerHTML=o+'<div class="sub" style="margin-top:8px">Sum of six intermarket signals (-6 to +6). Gold, VIX and DXY count inverted. <a href="markets.html">Details</a></div>'}
}catch(e){$('sub').textContent='Error: '+e.message}})();
</script></body></html>
