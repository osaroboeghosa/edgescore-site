<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markets - EdgeScore</title><link rel="stylesheet" href="app.css">
<style>.tw{overflow-x:auto}.tw table{width:100%;border-collapse:collapse;font-size:13px}.tw th,.tw td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--b);white-space:nowrap}.tw th{cursor:pointer;color:#94a3b8;font-weight:600}.tw th:first-child,.tw td:first-child{text-align:left}.tw tr[data-r]{cursor:pointer}.sx{background:rgba(248,113,113,.35)}.sc{background:rgba(251,191,36,.3)}.cg{background:rgba(52,211,153,.3)}.cr2{background:rgba(248,113,113,.3)}.two{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}.two>.card{min-width:0}@media(min-width:760px){.two{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body>
<div id="hdr"></div><main>
<h1>Markets</h1><div class="sub" id="sub">Loading...</div>
<div class="grid" id="kp"></div>
<div class="card"><h2>Risk gauge</h2><div id="rg"></div></div>
<div class="card"><h2>Volatility (ATR)</h2><div class="tw" id="vt"></div><div class="sub">ATR ratio = 14-day ATR vs its 100-day average. Under 0.8 compressed, over 1.2 expanded.</div></div>
<div class="two"><div class="card"><h2>Rate spreads</h2><div class="tw" id="rt"></div><div class="sub" id="rn"></div></div><div class="card"><h2>Carry vs score</h2><div class="tw" id="cm"></div></div></div>
</main><script src="app.js?v=2"></script><script src="markets.js?v=1"></script></body></html>
